<div class="sampler16 {{cns}}">
  <header mod-role="drag-handle"><strong>16 PADS</strong><span>WAV SAMPLER</span></header>
  <div class="sampler16-connectors">
    <span mod-role="input-midi-port" mod-port-symbol="events">MIDI</span>
    <button type="button" mod-role="bypass">Bypass</button>
    <span class="sampler16-bypass" mod-role="bypass-light"></span>
    <span mod-role="output-audio-port" mod-port-symbol="left">L</span>
    <span mod-role="output-audio-port" mod-port-symbol="right">R</span>
  </div>
  <div class="sampler16-grid"></div>
  <div class="sampler16-status" role="status" aria-live="polite"></div>
  <footer>Assign each pad's Trigger in MODEP settings (momentary mapping for Trig).<br>
    Assign samples in MODEP settings when file properties are supported.<br>
    Sample files must be available on the host.</footer>
</div>
