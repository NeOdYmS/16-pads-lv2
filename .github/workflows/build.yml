name: Build and test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install development dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config python3 lv2-dev liblilv-dev gcc-aarch64-linux-gnu
      - name: Native tests and build
        run: make test all test-ui test-state
      - name: Sanitizer tests
        run: make -B test CFLAGS="-O1 -g -fsanitize=address,undefined"
      - name: Linux aarch64 bundle
        run: |
          make BUNDLE=build/aarch64/16-pads.lv2 CC=aarch64-linux-gnu-gcc
          aarch64-linux-gnu-readelf -h build/aarch64/16-pads.lv2/sampler.so | grep AArch64
      - uses: actions/upload-artifact@v4
        with:
          name: 16-pads-linux-aarch64
          path: build/aarch64/16-pads.lv2
